<div class="login-card">
    <h1>Acesso Restrito</h1>
    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" [(ngModel)]="usuario" required placeholder="Digite seu usuário">
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" [(ngModel)]="senha" required placeholder="******">
        </div>
        <button type="submit" class="login-btn">Entrar</button>
    </form>
    <a routerLink="/" class="back-link">← Voltar ao Cardápio</a>
</div>
